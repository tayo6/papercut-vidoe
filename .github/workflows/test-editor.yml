name: Test editor sources
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: |
          node --check src/e_script.js
          node --check src/e_render.js
          node --check src/e_audio.js
          node --check src/e_ui_insp.js
          node --check src/e_ui_tl.js
      - name: Test property and scripting APIs
        run: |
          node tools/test_properties.js
          node tools/test_scripts.js
      - name: Build the single-file editor
        run: python3 tools/build.py src site/index.html
      - name: Check built page exists
        run: test -s site/index.html
