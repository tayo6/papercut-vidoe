<title>Snipwork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="embedded-fonts">/*FONTS*/</style>
<style>
/* Layout: a cutting-mat stage on top, a tool tray of controls beside it (stacked on phones). Paper, scissors and mat-green drive the palette. */
:root {
  --bg: #eef1ea;
  --panel: #fbfcf8;
  --fg: #15231b;
  --muted: #5b6b61;
  --line: #cfd8cd;
  --accent: #e8491a;
  --accent-ink: #ffffff;
  --tape: #f2c14e;
  --tape-ink: #2b2204;
  --mat: #1f4d39;
  --mat-line: rgba(255,255,255,.16);
  --mat-line-2: rgba(255,255,255,.32);
  --focus: #1b6ef3;
  --f-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1914; --panel: #17241d; --fg: #e8f0ea; --muted: #93a699; --line: #2a3d32;
    --accent: #ff6a33; --accent-ink: #1c0a02; --tape: #e9b93d; --tape-ink: #241b02;
    --mat: #163a2a; --mat-line: rgba(255,255,255,.12); --mat-line-2: rgba(255,255,255,.26);
    --focus: #6aa5ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1914; --panel: #17241d; --fg: #e8f0ea; --muted: #93a699; --line: #2a3d32;
  --accent: #ff6a33; --accent-ink: #1c0a02; --tape: #e9b93d; --tape-ink: #241b02;
  --mat: #163a2a; --mat-line: rgba(255,255,255,.12); --mat-line-2: rgba(255,255,255,.26);
  --focus: #6aa5ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.logo { height: 44px; max-width: 100%; display: block; }
.logo-fallback { font-family: var(--f-display); font-size: 28px; }
.tag { font-size: 13px; color: var(--muted); flex: 1 1 220px; min-width: 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
.tab {
  flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--panel); border-radius: 3px;
  padding: 7px 12px; font-weight: 600; font-size: 13px; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* studio grid */
.studio { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .studio { grid-template-columns: minmax(0, 1fr); } }
.stage-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mat {
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px),
    linear-gradient(var(--mat-line-2) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line-2) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
  border-radius: 4px; padding: 18px; position: relative; display: flex; justify-content: center;
}
.mat::before, .mat::after {
  content: attr(data-l); position: absolute; font: 10px var(--f-mono); color: rgba(255,255,255,.55); letter-spacing: .08em;
}
.mat::before { top: 4px; left: 8px; }
.mat::after { content: attr(data-r); top: 4px; right: 8px; }
.canvas-box { position: relative; width: 100%; max-width: 760px; line-height: 0; }
#stage { width: 100%; height: auto; display: block; background: #000; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.drop-hint {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0;
  background: rgba(232,73,26,.35); color: #fff; font: 600 18px var(--f-body); border: 3px dashed #fff;
}
.canvas-box.over .drop-hint { opacity: 1; }

/* transport */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1.5px solid var(--fg); background: var(--panel); border-radius: 3px; padding: 7px 12px; font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .5; cursor: progress; }
.readout { font: 12px var(--f-mono); color: var(--muted); margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips > .lbl { font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
.chip {
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 600; }
.sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.35); display: inline-block; }
.sw.checker { background: conic-gradient(#bbb 25%, #fff 0 50%, #bbb 0 75%, #fff 0); background-size: 8px 8px; }
.export { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: 1.5px dashed var(--line); border-radius: 4px; }
.export .lbl { font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 100%; }
.status { font-size: 12px; color: var(--muted); min-height: 18px; width: 100%; }
.progress { width: 100%; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: none; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); }

/* tool tray */
.tray { background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-width: 0; }
.group { border-bottom: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.group:last-child { border-bottom: 0; }
.group > h3 {
  margin: 0; font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.group > h3::before { content: ""; width: 14px; height: 6px; background: var(--tape); display: inline-block; transform: rotate(-4deg); }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px; }
.row output { font: 12px var(--f-mono); color: var(--muted); text-align: right; }
.row.plain { grid-template-columns: 96px minmax(0, 1fr); }
input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
input[type="text"], select, textarea {
  width: 100%; min-width: 0; background: var(--bg); border: 1.5px solid var(--line); border-radius: 3px; padding: 6px 8px;
}
textarea { resize: vertical; min-height: 56px; font-family: var(--f-body); }
input[type="color"] { width: 38px; height: 28px; padding: 0; border: 1.5px solid var(--line); border-radius: 3px; background: none; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.small-btn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 3px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
.small-btn:hover { border-color: var(--fg); }
.theme { margin-left: auto; }

/* feature list */
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; padding-top: 6px; border-top: 1.5px solid var(--line); }
.features h4 { margin: 0 0 2px; font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.features p { margin: 0; font-size: 12.5px; color: var(--muted); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches > .lbl { font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; padding: 0; border: 2px solid var(--panel); box-shadow: 0 0 0 1.5px var(--line); }
.swatch:hover, .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.export select { width: auto; }
.export .field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.export .field input[type="range"] { width: 90px; }
@media (min-width: 901px) { .tray { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; } }
.group[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
